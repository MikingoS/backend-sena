<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Recuperar Contraseña</title>
    <!-- Google Fonts - League Spartan -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Ruta a tu CSS principal -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="register-body">

    <div class="card-container">
        <!-- Contenido de la tarjeta -->
        <h1 class="title">Recuperar<br>Contraseña</h1>
        
        <p class="subtitle">Ingresa tus datos para contactar al administrador:</p>

        <form id="forgotPasswordForm">
            <div class="input-group">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" id="forgotUsuario" class="form-control" placeholder="Nombre De Usuario" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-id-card input-icon"></i>
                <input type="text" id="forgotCedula" class="form-control" placeholder="Cédula" required>
            </div>

            <div id="forgotMensaje" style="display: none; margin-bottom: 15px; font-weight: 700; font-size: 14px; text-align: center;"></div>

            <button type="submit" id="btnEnviarSolicitud" class="btn-register">
                AVISAR AL<br>ADMINISTRADOR
            </button>
        </form>

        <p class="footer-text">
            El administrador revisará tu solicitud y te contactará para restablecer tu contraseña
        </p>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usuario = document.getElementById('forgotUsuario').value.trim();
            const cedula = document.getElementById('forgotCedula').value.trim();
            const mensajeDiv = document.getElementById('forgotMensaje');
            const btn = document.getElementById('btnEnviarSolicitud');

            btn.disabled = true;
            mensajeDiv.style.display = 'block';
            mensajeDiv.style.color = '#ffffff';
            mensajeDiv.textContent = 'Enviando solicitud...';

            try {
                const respuesta = await fetch('http://localhost:3000/solicitudes_password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nombreUsuario: usuario,
                        cedula: cedula,
                        nuevaPassword: "",
                        fecha: new Date().toLocaleString(),
                        estado: "Pendiente"
                    })
                });

                if (respuesta.ok) {
                    mensajeDiv.style.color = '#28a745';
                    mensajeDiv.textContent = '¡Solicitud enviada al administrador con éxito!';
                    document.getElementById('forgotPasswordForm').reset();
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2500);
                } else {
                    throw new Error('Error al registrar la solicitud');
                }
            } catch (error) {
                console.error('Error:', error);
                mensajeDiv.style.color = '#ff6b6b';
                mensajeDiv.textContent = 'Error de conexión con el servidor.';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
