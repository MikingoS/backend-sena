<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Inventario</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Ruta relativa limpia -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout-container">
        
        <aside class="sidebar">
            <h2 class="logo">StockFlow</h2>
            <ul class="menu">
                <li><a href="dashboard.html" class="menu-item"><i class="fa-solid fa-user"></i> Usuarios</a></li>
                <li><a href="stock.html" class="menu-item"><i class="fa-solid fa-chart-simple"></i> Dashboard</a></li>
                <li><a href="inventario.html" class="menu-item active"><i class="fa-solid fa-box"></i> Inventario</a></li>
                <li><a href="movimientos.html" class="menu-item"><i class="fa-solid fa-arrows-rotate"></i> Movimientos</a></li>
                <li><a href="configuracion.html" class="menu-item"><i class="fa-solid fa-gear"></i> Configuración</a></li>
            </ul>
        </aside>

        <main class="main-wrapper">
            <header class="top-bar">
                <div class="header-title-container">
                    <img src="Img/logo-stockflow2.png" alt="Logo" class="title-logo">
                    <h2>GESTIÓN DE INVENTARIO</h2>
                </div>
                
                <div class="top-actions">
                    <input type="text" id="searchInventarioInput" placeholder="Buscar por producto o SKU..." class="search-input">
                    
                    <div class="notification-container" id="notificationContainer">
                        <i class="fa-regular fa-bell notification-icon" id="bellIcon"></i>
                        <span class="notification-badge-count" id="notifBadge">0</span>
                        
                        <div class="notification-dropdown" id="notificationDropdown">
                            <div class="notification-header-title">
                                <span>Notificaciones del Sistema</span>
                                <i class="fa-solid fa-xmark" id="closeDropdown"></i>
                            </div>
                            <div class="notification-list" id="notificationListContent"></div>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content-area">
                <div class="action-buttons-group">
                    <button class="btn-action btn-ingresar" onclick="togglePanelIngresarProducto()">
                        <i class="fa-solid fa-plus"></i> Ingresar Producto
                    </button>
                    <button class="btn-action btn-sacar" onclick="alternarModoBorrado()">
                        <i class="fa-solid fa-trash"></i> <span id="textoBtnSacar">Sacar Producto (Eliminar)</span>
                    </button>
                </div>

                <div id="panel-ingresar-producto" class="action-dropdown-row" style="display: none; margin-bottom: 20px;">
                    <div class="action-panel-container">
                        <h4><i class="fa-solid fa-box-open"></i> Ingresar Nuevo Producto</h4>
                        <form onsubmit="guardarNuevoProducto(event)" class="inline-form">
                            <div class="form-group" style="margin-bottom: 12px;">
                                <label>Nombre del Producto:</label>
                                <input type="text" id="nuevoNombreProd" class="form-control" placeholder="Ej: Arroz, Carne..." required>
                            </div>
                            <div class="form-group" style="margin-bottom: 12px;">
                                <label>Stock Inicial:</label>
                                <input type="number" id="nuevoStockProd" class="form-control" min="0" value="1" required>
                            </div>
                            <div class="form-group" style="margin-bottom: 15px;">
                                <label>Stock Mínimo de Alerta:</label>
                                <input type="number" id="nuevoStockMin" class="form-control" min="0" value="5" required>
                            </div>
                            <div class="panel-actions">
                                <button type="submit" class="btn-save"><i class="fa-solid fa-check"></i> Guardar Producto</button>
                                <button type="button" class="btn-cancel" onclick="togglePanelIngresarProducto()">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>SKU</th>
                                <th>Nombre del producto</th>
                                <th>Stock Actual</th>
                                <th>Stock Mínimo</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-inventario-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="jsmain.js"></script>
</body>
</html>
