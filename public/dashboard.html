<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Gestión de Usuarios</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Ruta relativa limpia y sin direcciones absolutas -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout-container">
        
        <aside class="sidebar">
            <h2 class="logo">StockFlow</h2>
            <ul class="menu">
                <li><a href="dashboard.html" class="menu-item active"><i class="fa-solid fa-user"></i> Usuarios</a></li>
                <li><a href="stock.html" class="menu-item"><i class="fa-solid fa-chart-simple"></i> Dashboard</a></li>
                <li><a href="inventario.html" class="menu-item"><i class="fa-solid fa-box"></i> Inventario</a></li>
                <li><a href="movimientos.html" class="menu-item"><i class="fa-solid fa-arrows-rotate"></i> Movimientos</a></li>
                <li><a href="configuracion.html" class="menu-item"><i class="fa-solid fa-gear"></i> Configuración</a></li>
            </ul>
        </aside>

        <main class="main-wrapper">
            <header class="top-bar">
                <div class="header-title-container">
                    <img src="Img/logo-stockflow2.png" alt="Logo" class="title-logo">
                    <h2>GESTIÓN DE USUARIOS</h2>
                </div>
                
                <div class="top-actions">
                    <input type="text" id="searchInput" placeholder="Buscar por ID, nombre o rol..." class="search-input">
                    
                    <div class="notification-container" id="notificationContainer">
                        <i class="fa-regular fa-bell notification-icon" id="bellIcon"></i>
                        <span class="notification-badge-count" id="notifBadge">0</span>
                        
                        <div class="notification-dropdown" id="notificationDropdown">
                            <div class="notification-header-title">
                                <span>Solicitudes de Contraseña</span>
                                <i class="fa-solid fa-xmark" id="closeDropdown"></i>
                            </div>
                            <div class="notification-list" id="notificationListContent"></div>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content-area">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th></th>
                                <th>ID</th>
                                <th>Nombre de Usuario</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    
    <script src="jsmain.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const bellIcon = document.getElementById("bellIcon");
            const notificationDropdown = document.getElementById("notificationDropdown");
            const closeDropdown = document.getElementById("closeDropdown");
            const notificationContainer = document.getElementById("notificationContainer");

            if (typeof esAdministradorOEquivalente === 'function' && !esAdministradorOEquivalente()) {
                if (notificationContainer) notificationContainer.style.display = "none";
            }
            if (bellIcon) {
                bellIcon.addEventListener("click", (e) => {
                    e.stopPropagation();
                    notificationDropdown.classList.toggle("active");
                });
            }
            if (closeDropdown) {
                closeDropdown.addEventListener("click", () => {
                    notificationDropdown.classList.remove("active");
                });
            }
            document.addEventListener("click", (e) => {
                if (notificationDropdown && !notificationDropdown.contains(e.target) && e.target !== bellIcon) {
                    notificationDropdown.classList.remove("active");
                }
            });
        });
    </script>
</body>
</html>
